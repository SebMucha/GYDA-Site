<section id="contact" class="contact" aria-labelledby="contact-title">
  <img
    class="contact__bg"
    src="assets/images/Old Tbilisi Pic.jpg"
    alt=""
    width="2400"
    height="1425"
    loading="lazy"
    decoding="async"
  />

  <div class="container">
    <header class="section-head" appReveal>
      <h2 id="contact-title">Contact Us</h2>
    </header>

    <div class="contact__grid">
      <div class="glass contact__form-card" appReveal>
        <app-contact-form idPrefix="contact" />
      </div>

      <div class="contact__side">
        <div class="glass contact__map" appReveal="90">
          <img
            src="assets/images/Map Pic.jpg"
            alt="Map showing GYDA’s location in Tbilisi"
            width="1400"
            height="938"
            loading="lazy"
            decoding="async"
          />
          <a class="contact__map-link" [href]="links.maps" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
            Open in Google Maps
          </a>
        </div>

        <div class="glass contact__info" appReveal="180">
          <h3>Contact Info</h3>
          <ul>
            <li>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
              <span>Address: {{ links.address }}</span>
            </li>
            <li>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg>
              <span>Phone: <a href="tel:+995511133874">{{ links.phone }}</a></span>
            </li>
            <li>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
              <span>Email: <a [href]="'mailto:' + links.email">{{ links.email }}</a></span>
            </li>
            <li>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>
              <span>Identification Number: 400138597</span>
            </li>
          </ul>

          <div class="socials contact__socials">
            <a [href]="links.facebook" target="_blank" rel="noopener noreferrer" aria-label="GYDA on Facebook">
              <img src="assets/images/Facebook icon.png" alt="" width="30" height="30" loading="lazy" />
            </a>
            <a [href]="links.instagram" target="_blank" rel="noopener noreferrer" aria-label="GYDA on Instagram">
              <img src="assets/images/Instagram Icon.png" alt="" width="30" height="30" loading="lazy" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
