<section id="home" class="hero" aria-labelledby="hero-title">
  <img
    class="hero__bg"
    src="assets/images/Main page background first pic.jpg"
    alt=""
    width="2400"
    height="1558"
    fetchpriority="high"
  />

  <div class="hero__content container">
    <span class="hero__badge"><span class="hero__dot" aria-hidden="true"></span>Tbilisi · Since 2015</span>

    <h1 id="hero-title">Opening doors to Europe for young people in Georgia</h1>

    <p class="hero__lead">
      Youth exchanges, training courses and local projects for active citizenship, inclusion
      and green skills with a focus on young people with fewer opportunities
    </p>

    <div class="hero__actions">
      <a class="btn btn--light" href="#projects">Join a project</a>
      <a class="btn btn--outline" [href]="partnersPif" download>For partners</a>
    </div>
  </div>

  <a class="hero__scroll" href="#mission" aria-label="Scroll to our mission">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </a>
</section>
