<div class="header__inner container">
  <a class="brand" href="#home" (click)="navigate($event, 'home')" aria-label="GYDA – back to top">
    <img
      class="brand__logo"
      src="assets/images/Site Logo.png"
      alt="GYDA logo"
      width="48"
      height="48"
    />
    <span class="brand__text">
      <span class="brand__ka" lang="ka">ქართველი ახალგაზრდების განვითარების ასოციაცია (GYDA)</span>
      <span class="brand__en">Georgian Youth Development Association</span>
    </span>
  </a>

  <button
    class="burger"
    type="button"
    [class.is-open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="primary-nav"
    aria-label="Toggle navigation"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="primary-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Primary">
    <ul>
      @for (item of navItems; track item.id) {
        <li>
          <a
            [href]="'#' + item.id"
            [class.is-active]="activeId() === item.id"
            [attr.aria-current]="activeId() === item.id ? 'location' : null"
            (click)="navigate($event, item.id)"
          >{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
</div>
